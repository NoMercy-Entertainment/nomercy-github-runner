# DEPRECATED 2026-09-22. This is the ancestor of the Linux unit image now
# built and driven by the controller on Hyper-V workers; see
# docs/operations/runner-platform.md. No fail-fast here: the unit images
# descend from this file and do not read it at runtime.
#
# GitHub Actions runners — isolated engine
#
# This stack runs on the dedicated `github-runners` WSL distro, NOT on Docker
# Desktop. That distro has its own dockerd and its own virtual disk at
# D:\Docker\GithubRunners\Data\ext4.vhdx, so these containers share no disk,
# image store, volume namespace or socket with the BeastStack production stack.
# A runner filling its disk cannot starve Immich, MinIO or Forgejo.
#
#   wsl -d github-runners -u root -- bash -lc \
#     "cd /mnt/d/docker-compose/GithubRunners && docker compose -f docker-compose.runners.yml up -d"
#
# Six explicit services rather than `deploy.replicas: 6`: replicas all receive
# identical mounts, and six Docker-in-Docker daemons sharing one data root
# corrupt each other within minutes.

x-runner: &runner
  image: ghcr.io/nomercy-entertainment/nomercy-github-runner:latest
  restart: unless-stopped
  privileged: true
  deploy:
    resources:
      limits:
        cpus: "${RUNNER_CPU_LIMIT:-0}"
        memory: "${RUNNER_MEM_LIMIT:-0}"
  # The memory limit counts page cache, so at the limit the kernel reclaims a
  # runner's cache instead of letting it grow the WSL VM (vmmem stood at 149 GB
  # on 2026-09-15, ~16 GB of it process memory). Swap capped at the same value,
  # or the overflow is paged out to disk instead of reclaimed.
  #
  # Sized at 32g since 2026-09-17. At 16g the cross-compile stages of the
  # ffmpeg builds were OOM-killed: they peak near 17 GB of process memory
  # (~55 concurrent cc1plus at -j$(nproc), where nproc reports all host cores).
  # The limit is a ceiling, not a reservation, so the nominal total across the
  # fleet may exceed the 160 GB the WSL VM is given in .wslconfig; what has to
  # fit is the sum of concurrent peaks. Raising this further needs that sum
  # rechecked, because the VM has no room left for a fleet-wide peak.
  memswap_limit: "${RUNNER_MEM_LIMIT:-0}"
  environment:
    GH_TOKEN: ${GH_TOKEN}
    GITHUB_ORG: ${GITHUB_ORG:-NoMercy-Entertainment}
    RUNNER_LABELS: ${RUNNER_LABELS:-self-hosted,Linux,X64}
    RUNNER_GROUP: ${RUNNER_GROUP:-}
  volumes:
    # Bound straight from the repo on D: (9p) — verified fine. An earlier
    # theory blamed 9p for a restart loop; that was wrong. The loop was WSL
    # shutting the distro down when idle, which stopped docker.service and
    # SIGTERMed every container. The keepalive that worked around it is gone
    # along with the distro; see docs/operations/runner-platform.md.
    # Read-only: start.sh is executed, never written to.
    - ./scripts/start.sh:/root/start.sh:ro
  # No tmpfs on /tmp: that is RAM, counted against the memory limit above and
  # held by the VM for as long as the container lives. /tmp lives on the
  # distro's disk on D: like the rest of the container.
  # Docker Engine 29.x creates containers with StopTimeout=1 instead of the
  # documented 10 (moby/moby#52775). start.sh deregisters the runner from
  # GitHub on SIGTERM and needs ~3s to do it; at 1s it is SIGKILLed mid-flight
  # and the registration is orphaned. Without this line the deregistration fix
  # silently stops working.
  stop_grace_period: 60s

services:
  # Its own volume for the nested engine's data root. This is what lets the
  # runner use overlay2 instead of fuse-overlayfs: overlay2 cannot stack on
  # another overlay, and without this the daemon's data root IS the
  # container's overlay writable layer. A volume is plain ext4, so the
  # constraint disappears. scripts/start.sh detects which of the two it has
  # and configures the daemon accordingly, so removing this line rolls a
  # single runner back with no other change.
  #
  # It also fixes the accounting that hid a full disk: `docker system df`
  # under fuse-overlayfs reported 1.3 GB where 59 GB was on disk, so the
  # dashboard's cache meter and the builder gc ceiling were both reading a
  # number that did not exist. And the build cache now survives a recreate,
  # because it no longer lives in the layer a recreate throws away.
  github-runner-1:
    <<: *runner
    container_name: github-runner-1
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-1-docker:/var/lib/docker

  github-runner-2:
    <<: *runner
    container_name: github-runner-2
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-2-docker:/var/lib/docker

  github-runner-3:
    <<: *runner
    container_name: github-runner-3
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-3-docker:/var/lib/docker

  github-runner-4:
    <<: *runner
    container_name: github-runner-4
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-4-docker:/var/lib/docker

  github-runner-5:
    <<: *runner
    container_name: github-runner-5
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-5-docker:/var/lib/docker

  github-runner-6:
    <<: *runner
    container_name: github-runner-6
    volumes:
      - ./scripts/start.sh:/root/start.sh:ro
      - github-runner-6-docker:/var/lib/docker

  # Forgejo Actions runner. Own nested daemon, exactly like the GitHub
  # runners, so a Forgejo job filling a disk cannot reach anything else.
  #
  # Reached over the public URL rather than http://forgejo:3000: that compose
  # network is on Docker Desktop's engine and does not exist here.
  forgejo-runner-1:
    # Built here, not pulled. Nothing publishes this tag - the CI job in
    # .github/workflows/build-image.yml builds the GitHub runner image only -
    # so without a build stanza `compose up` ends at `manifest unknown`, and
    # so does the dashboard's "+ Add runner" for Forgejo, which uses this
    # same tag. `image:` is kept alongside `build:` (the pattern the
    # dashboard service below already uses) so the built image is tagged with
    # the name providers.FORGEJO defaults to.
    #
    # The context is the REPOSITORY ROOT, not ./forgejo-runner: the Dockerfile
    # does `COPY scripts/start-forgejo.sh`, which a context rooted at the
    # Dockerfile's own directory cannot see.
    build:
      context: .
      dockerfile: forgejo-runner/Dockerfile
    image: ghcr.io/nomercy-entertainment/nomercy-forgejo-runner:latest
    container_name: forgejo-runner-1
    restart: unless-stopped
    privileged: true
    # Same limits as the GitHub fleet above, from the same two variables.
    # docker_ops.create() applies RUNNER_CPU_LIMIT/RUNNER_MEM_LIMIT to every
    # Forgejo runner the dashboard creates; without this the one runner
    # declared here would be the single container in the fleet running
    # unbounded, which is not a policy anybody chose.
    deploy:
      resources:
        limits:
          cpus: "${RUNNER_CPU_LIMIT:-0}"
          memory: "${RUNNER_MEM_LIMIT:-0}"
    memswap_limit: "${RUNNER_MEM_LIMIT:-0}"
    labels:
      nomercy.runner: "true"
      nomercy.provider: "forgejo"
    environment:
      FORGEJO_INSTANCE_URL: ${FORGEJO_INSTANCE_URL}
      # Only read on first boot, when /data/.runner does not exist yet.
      # Runners the dashboard creates instead get a token minted fresh per
      # runner through the admin API - see docs/forgejo-runner-migration.md.
      FORGEJO_RUNNER_REGISTRATION_TOKEN: ${FORGEJO_RUNNER_REGISTRATION_TOKEN:-}
      FORGEJO_RUNNER_LABELS: ${FORGEJO_RUNNER_LABELS}
      FORGEJO_RUNNER_NAME: forgejo-runner-1
    volumes:
      - forgejo-runner-1-data:/data
      - forgejo-runner-1-docker:/var/lib/docker
    # Not for deregistration - start-forgejo.sh cannot deregister and does not
    # try (see the long comment there). This is for the nested daemon: the
    # script forwards SIGTERM to the runner child and waits for it, and
    # Engine 29.x's StopTimeout=1 default (moby/moby#52775) would SIGKILL the
    # whole container before that has a chance to finish.
    stop_grace_period: 60s

  # Live status page for the fleet: http://localhost:9200
  #
  # The Docker socket is mounted READ-ONLY and it is THIS engine's socket, not
  # Docker Desktop's. So the dashboard can inspect the runners and structurally
  # cannot see, let alone touch, BeastStack.
  dashboard:
    build: ./dashboard
    image: nomercy/runner-dashboard:local
    container_name: runner-dashboard
    restart: unless-stopped
    environment:
      # Path to the repo AS THE DAEMON SEES IT. Bind mounts for runners the
      # dashboard creates are resolved by the daemon, not by this container,
      # so a container-local path would silently mount an empty directory.
      REPO_HOST_PATH: /mnt/d/docker-compose/GithubRunners
      ENV_PATH: /repo/.env
    volumes:
      # Read-WRITE: the dashboard starts, stops, creates and removes runners.
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-WRITE: the settings page edits .env.
      - ./:/repo
      - dashboard-data:/data
    ports:
      - "9200:9200"

volumes:
  dashboard-data:
  forgejo-runner-1-data:
  github-runner-1-docker:
  github-runner-2-docker:
  github-runner-3-docker:
  github-runner-4-docker:
  github-runner-5-docker:
  github-runner-6-docker:
  forgejo-runner-1-docker:
