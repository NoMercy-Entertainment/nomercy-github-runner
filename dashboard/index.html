<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoMercy Runners</title>
<style>
:root {
  --bg:        #0b0d0f;
  --bg-panel:  #121619;
  --bg-inset:  #0e1113;
  --rule:      #1e262b;
  --rule-hot:  #2b373e;
  --text:      #d5dde2;
  --text-dim:  #6b7a84;
  --text-faint:#3d4a52;
  --signal:    #5ee6a0;
  --signal-dk: #1d5c40;
  --busy:      #ffb340;
  --busy-dk:   #5c4118;
  --alert:     #ff5f56;
  --alert-dk:  #5c1f1c;
  --grid:      rgba(255,255,255,.022);
  --label: "Bahnschrift", "DIN Alternate", "Roboto Condensed", system-ui, sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#e9e6df; --bg-panel:#f5f3ee; --bg-inset:#dedad1;
    --rule:#c9c3b6; --rule-hot:#a89f8d;
    --text:#1d2226; --text-dim:#5d6670; --text-faint:#9aa2aa;
    --signal:#0d7a4d; --signal-dk:#a9dcc3;
    --busy:#a1610a; --busy-dk:#f0d9ae;
    --alert:#b3241c; --alert-dk:#f0c0bd;
    --grid: rgba(0,0,0,.03);
  }
}
* { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }
body {
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 3px,
    radial-gradient(120% 80% at 50% -10%, rgba(94,230,160,.05), transparent 60%),
    var(--bg);
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.45;
  min-height: 100vh;
  padding: clamp(14px, 3vw, 32px);
}

/* ---------- header ---------- */
header {
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:clamp(16px,4vw,48px);
  border-bottom:1px solid var(--rule); padding-bottom:16px; margin-bottom:22px;
}
.brand { margin-right:auto; }
.brand h1 {
  font-family:var(--label); font-weight:600; font-size:clamp(20px,3.4vw,30px);
  letter-spacing:.14em; text-transform:uppercase; line-height:1;
}
.brand .sub {
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--text-faint); margin-top:6px;
}
.stat { text-align:right; }
.stat .n {
  font-family:var(--label); font-size:clamp(22px,3.6vw,34px); font-weight:600;
  line-height:1; letter-spacing:.02em; font-variant-numeric:tabular-nums;
}
.stat .k {
  font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
  color:var(--text-faint); margin-top:5px;
}
.n.ok   { color:var(--signal); }
.n.work { color:var(--busy); }

/* ---------- live pill ---------- */
.live {
  display:inline-flex; align-items:center; gap:7px; font-size:10px;
  letter-spacing:.18em; text-transform:uppercase; color:var(--text-dim);
  border:1px solid var(--rule); border-radius:2px; padding:4px 9px;
}
.dot { width:6px; height:6px; border-radius:50%; background:var(--signal);
       box-shadow:0 0 0 0 var(--signal); animation:ping 2.4s ease-out infinite; }
@keyframes ping {
  0%   { box-shadow:0 0 0 0 rgba(94,230,160,.55); }
  70%  { box-shadow:0 0 0 7px rgba(94,230,160,0); }
  100% { box-shadow:0 0 0 0 rgba(94,230,160,0); }
}
.stale .dot { background:var(--alert); animation:none; }
.stale { color:var(--alert); border-color:var(--alert-dk); }

/* ---------- alert banner ---------- */
#banner {
  display:none; border:1px solid var(--alert-dk); background:var(--bg-panel);
  border-left:3px solid var(--alert); padding:11px 14px; margin-bottom:20px;
  font-size:12px; color:var(--alert);
}
#banner.show { display:block; animation:slip .3s ease-out; }
@keyframes slip { from { opacity:0; transform:translateY(-5px);} to {opacity:1;transform:none;} }

/* ---------- grid ---------- */
.grid {
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill, minmax(310px, 1fr));
}
.card {
  background:var(--bg-panel); border:1px solid var(--rule);
  padding:14px 15px 15px; position:relative; overflow:hidden;
  animation:rise .45s cubic-bezier(.2,.7,.3,1) backwards;
}
@keyframes rise { from { opacity:0; transform:translateY(9px);} to {opacity:1;transform:none;} }
/* left signal edge encodes state at a glance, before any text is read */
.card::before {
  content:""; position:absolute; left:0; top:0; bottom:0; width:2px;
  background:var(--rule-hot);
}
.card.busy::before { background:var(--busy); }
.card.idle::before { background:var(--signal-dk); }
.card.busy {
  background:
    linear-gradient(90deg, rgba(255,179,64,.045), transparent 45%),
    var(--bg-panel);
}

.chead { display:flex; align-items:baseline; gap:9px; margin-bottom:3px; }
.cname {
  font-family:var(--label); font-size:15px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase;
}
.badge {
  margin-left:auto; font-size:9px; letter-spacing:.16em; text-transform:uppercase;
  padding:2px 7px; border:1px solid currentColor; border-radius:2px;
}
.badge.idle { color:var(--text-dim); }
.badge.busy { color:var(--busy); animation:breathe 2s ease-in-out infinite; }
@keyframes breathe { 0%,100%{opacity:1} 50%{opacity:.5} }

.creg { font-size:11px; color:var(--text-faint); letter-spacing:.04em; }
.cjob {
  margin:9px 0 12px; font-size:11.5px; color:var(--busy);
  border-left:2px solid var(--busy-dk); padding-left:8px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.cjob.none { color:var(--text-faint); border-color:var(--rule); }

/* ---------- meters ---------- */
.meter { margin-top:9px; }
.mrow {
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:9.5px; letter-spacing:.15em; text-transform:uppercase;
  color:var(--text-faint); margin-bottom:4px;
}
.mval { color:var(--text-dim); font-size:10.5px; letter-spacing:.02em;
        font-variant-numeric:tabular-nums; text-transform:none; }
.track {
  position:relative; height:7px; background:var(--bg-inset);
  border:1px solid var(--rule); overflow:hidden;
}
.fill {
  height:100%; width:0; transition:width .6s cubic-bezier(.2,.7,.3,1);
  background:var(--signal);
}
.fill.warn { background:var(--busy); }
.fill.crit { background:var(--alert); }
/* segmented VU-meter ticks over the fill */
.track::after {
  content:""; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(90deg,
    transparent 0 4px, var(--bg-panel) 4px 5px);
  opacity:.85;
}

/* ---------- footer disk ---------- */
.disk {
  margin-top:22px; border:1px solid var(--rule); background:var(--bg-panel);
  padding:15px 16px;
}
.disk .mrow { font-size:10px; }
.disk .track { height:11px; }
.diskpath {
  font-size:10px; color:var(--text-faint); margin-top:9px; letter-spacing:.04em;
}
footer {
  margin-top:16px; display:flex; flex-wrap:wrap; gap:10px 20px;
  font-size:10px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-faint); border-top:1px solid var(--rule); padding-top:12px;
}
.skel { color:var(--text-faint); padding:34px 0; text-align:center; letter-spacing:.2em;
        text-transform:uppercase; font-size:11px; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>NoMercy Runners</h1>
    <div class="sub">Isolated engine &middot; github-runners</div>
  </div>
  <div class="stat"><div class="n ok"  id="s-online">&mdash;</div><div class="k">Online</div></div>
  <div class="stat"><div class="n work" id="s-busy">&mdash;</div><div class="k">Busy</div></div>
  <div class="stat">
    <div class="live" id="live"><span class="dot"></span><span id="live-txt">Connecting</span></div>
  </div>
</header>

<div id="banner"></div>
<div class="grid" id="grid"><div class="skel">Awaiting telemetry</div></div>

<div class="disk">
  <div class="mrow">
    <span>Runner Volume</span>
    <span class="mval" id="disk-val">&mdash;</span>
  </div>
  <div class="track"><div class="fill" id="disk-fill"></div></div>
  <div class="diskpath">D:\Docker\GithubRunners\Data\ext4.vhdx &mdash; separate disk from BeastStack</div>
</div>

<footer>
  <span id="f-gen">Updated &mdash;</span>
  <span id="f-count">&mdash; runners</span>
  <span>Build cache cap 20 GB / runner</span>
</footer>

<script>
const STALE_MS = 25000;
let lastGood = 0;

const $ = id => document.getElementById(id);

// Sizes arrive as docker-formatted strings ("12.4GB", "3.2GiB"). Parse to bytes
// so meters can be scaled; fall back to 0 rather than NaN, which would render
// as a full bar and read as an emergency.
function toBytes(s) {
  if (!s) return 0;
  const m = String(s).trim().match(/^([\d.]+)\s*([KMGTP]?i?B)?$/i);
  if (!m) return 0;
  const n = parseFloat(m[1]); if (isNaN(n)) return 0;
  const u = (m[2] || 'B').toUpperCase().replace('I', '');
  return n * ({B:1, KB:1e3, MB:1e6, GB:1e9, TB:1e12, PB:1e15}[u] || 1);
}
const gb = b => (b / 1e9);
const fmtGB = b => gb(b) < 10 ? gb(b).toFixed(2) + ' GB' : Math.round(gb(b)) + ' GB';

function meter(label, valText, pct, cls) {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="meter">
    <div class="mrow"><span>${label}</span><span class="mval">${valText}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${p}%"></div></div>
  </div>`;
}
const level = p => p >= 90 ? 'crit' : p >= 70 ? 'warn' : '';

function render(d) {
  const rs = d.runners || [];
  const busy = rs.filter(r => r.state === 'busy').length;
  $('s-online').textContent = rs.length;
  $('s-busy').textContent = busy;
  $('f-count').textContent = rs.length + ' runners';
  $('f-gen').textContent = 'Updated ' + (d.generated || '').replace('T', ' ').replace('Z', ' UTC');

  $('grid').innerHTML = rs.map((r, i) => {
    const cpu = Math.max(0, Math.min(100, Number(r.cpu_percent) || 0));
    const mu = toBytes(r.mem_used), ml = toBytes(r.mem_limit);
    const memPct = ml > 0 ? (mu / ml) * 100 : 0;
    const cache = toBytes(r.build_cache);
    const cachePct = (cache / 20e9) * 100;   // against the 20 GB GC cap
    return `<article class="card ${r.state}" style="animation-delay:${i * 45}ms">
      <div class="chead">
        <span class="cname">${r.name.replace('github-runner-', 'Runner ')}</span>
        <span class="badge ${r.state}">${r.state}</span>
      </div>
      <div class="creg">${r.registration} &middot; up ${r.uptime || '?'}</div>
      <div class="cjob ${r.job ? '' : 'none'}">${r.job || 'no active job'}</div>
      ${meter('CPU', cpu.toFixed(1) + '%', cpu, level(cpu))}
      ${meter('Memory', (r.mem_used || '0B') + ' / ' + (r.mem_limit || '?'), memPct, level(memPct))}
      ${meter('Build cache', fmtGB(cache) + ' / 20 GB', cachePct, level(cachePct))}
    </article>`;
  }).join('') || '<div class="skel">No runners reporting</div>';

  const dk = d.disk || {};
  const dpct = Number(dk.percent) || 0;
  $('disk-val').textContent = fmtGB(dk.used_bytes || 0) + ' / ' + fmtGB(dk.total_bytes || 0) + '  (' + dpct + '%)';
  const df = $('disk-fill');
  df.style.width = Math.min(100, dpct) + '%';
  df.className = 'fill ' + level(dpct);
}

// A dashboard that silently shows stale numbers is worse than one that admits
// it lost contact - you would trust figures that stopped being true.
function setStale(msg) {
  $('live').classList.add('stale');
  $('live-txt').textContent = 'Stale';
  const b = $('banner');
  b.textContent = msg;
  b.classList.add('show');
}
function setLive() {
  $('live').classList.remove('stale');
  $('live-txt').textContent = 'Live';
  $('banner').classList.remove('show');
}

async function tick() {
  try {
    const res = await fetch('status.json?t=' + Date.now(), {cache: 'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const d = await res.json();
    render(d);
    lastGood = Date.now();
    setLive();
  } catch (e) {
    if (lastGood && Date.now() - lastGood > STALE_MS) {
      setStale('Lost contact with the collector - figures below are from ' +
               Math.round((Date.now() - lastGood) / 1000) + 's ago. ' + e.message);
    } else if (!lastGood) {
      setStale('Cannot reach the collector: ' + e.message);
    }
  }
}
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
