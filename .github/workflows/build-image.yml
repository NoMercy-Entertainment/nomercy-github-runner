name: Build Runner Image

on:
  push:
    branches: [master]
    paths:
      - 'dockerfile'
      # scripts/start.sh, not scripts/**. This job builds the GITHUB runner
      # image, and `dockerfile` copies exactly one script into it
      # (ADD scripts/start.sh). Under scripts/** the addition of
      # scripts/start-forgejo.sh - which belongs to a different image this job
      # does not build - republished the whole GitHub runner image, and so
      # would every edit to the PowerShell provisioning scripts beside it.
      - 'scripts/start.sh'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:

concurrency:
  group: build-runner-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image metadata
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository }}
          # Lowercase the image name (GHCR requires it)
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "image=${IMAGE}" >> $GITHUB_OUTPUT
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT

      - name: Build and push image
        run: |
          IMAGE="${{ steps.meta.outputs.image }}"
          SHA="${{ steps.meta.outputs.sha }}"

          docker buildx build \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${SHA}" \
            --push \
            .

      - name: Verify image
        run: |
          docker pull "${{ steps.meta.outputs.image }}:latest"
          echo "Image pushed and verified."
