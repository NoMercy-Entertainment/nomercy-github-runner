name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    # GitHub's service caps self-hosted jobs at five days; omission means six hours.
    timeout-minutes: 7200
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install flask==3.0.3 flask-sock==0.7.0 cryptography==48.0.1 pyyaml pytest
      - name: Agent tests
        working-directory: agent
        run: python -m pytest -q -p no:cacheprovider
      - name: Node check
        run: |
          node --version || echo "no node: the renderer tests will skip"
      - name: Dashboard tests
        working-directory: dashboard
        run: python -m pytest -q -p no:cacheprovider
